<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مسح الأسعار</title>
<link rel="manifest" href="manifest-scan.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسح">
<style>
:root{--surface:#ffffff;--fg:#17201c;--muted:#5d6b64;--accent:#0b6b4f;--on-accent:#fff;--bad:#a63a2b;
  --font:'Geeza Pro','Segoe UI','Noto Naskh Arabic','Arial',sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--surface:#1a2320;--fg:#e8efeb;--muted:#9aaba3;--accent:#5fd0a5;--on-accent:#08231a;--bad:#ff8b7a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:var(--font);font-size:17px}
body{display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
#top b{font-size:18px}
#top a{color:#fff;background:#ffffff26;border-radius:10px;padding:9px 14px;text-decoration:none;font-weight:700;font-size:15px}
#reader{flex:1;min-height:0;overflow:hidden;position:relative}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
#start{position:absolute;inset:0;margin:auto;width:220px;height:64px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font:800 20px var(--font);z-index:2}
#start[hidden]{display:none}
#res{background:var(--surface);color:var(--fg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));min-height:130px;border-radius:18px 18px 0 0}
.hint{color:var(--muted);text-align:center;padding-top:24px}
.rn{font-weight:800;font-size:19px;overflow-wrap:anywhere}
.rp{font-weight:800;font-size:44px;color:var(--accent);direction:ltr;text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.rp small{font-size:16px;color:var(--muted);font-weight:400;margin-inline-start:6px}
.rb{color:var(--muted);font-size:14px;direction:ltr;text-align:right}
.bad{color:var(--bad);font-weight:800;font-size:18px}
#box{position:absolute;border:3px solid #5fd0a5;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none;z-index:1}
</style>
</head>
<body>
<div id="top"><div><b>مسح الأسعار</b><br><small id="upd" style="color:#ffffffb0;font-size:12px"></small></div></div>
<div id="reader"><button id="start" type="button" hidden>ابدأ المسح</button></div>
<div id="res"><div class="hint">جاري فتح الكاميرا...</div></div>
<script src="data.js"></script>
<script>
const DATA=window.DATA||[];
const BC=new Map();
DATA.forEach((r,i)=>r[2].forEach(b=>{const k=b.replace(/^0+/,'');if(!BC.has(k))BC.set(k,[]);BC.get(k).push(i)}));
const $=id=>document.getElementById(id),res=$('res'),startBtn=$('start');
const fmt=n=>n.toLocaleString('en-US');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showResult(code){
  const hits=BC.get(code.replace(/^0+/,''));
  if(!hits){res.innerHTML='<div class="bad">هذا الباركود غير موجود في القائمة</div><div class="rb">'+esc(code)+'</div>';return}
  res.innerHTML=hits.slice(0,3).map(i=>'<div style="margin-bottom:8px"><div class="rn">'+esc(DATA[i][0])+'</div><div class="rp">'+fmt(DATA[i][1])+'<small>د.ع</small></div></div>').join('')+'<div class="rb">'+esc(code)+'</div>';
}
let last='',lastT=0;
let ac=null;
function unlockAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
['touchstart','click'].forEach(e=>addEventListener(e,unlockAudio,{passive:true}));
function beep(ok){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=ok?1800:400;g.gain.value=0.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(ok?0.12:0.3))}catch(e){}}
function onCode(t){const n=Date.now();if(t===last&&n-lastT<2500){lastT=n;return}last=t;lastT=n;showResult(t);beep(BC.has((t).replace(/^0+/,'')));try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
let stream=null,running=false,runId=0,vid=null,box=null,libLoading=null;
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function loadLib(){
  if(window.ZXingWASM)return Promise.resolve();
  if(libLoading)return libLoading;
  libLoading=new Promise((ok,no)=>{const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.3/dist/iife/reader/index.js';
    s.onload=ok;s.onerror=()=>{libLoading=null;no(new Error('lib'))};document.head.appendChild(s)});
  return libLoading;
}
function boxRect(rd){
  const W=rd.clientWidth,H=rd.clientHeight,w=Math.floor(W*0.85),h=Math.floor(Math.min(H*0.5,W*0.45));
  return {W,H,x:Math.floor((W-w)/2),y:Math.floor((H-h)/2),w,h};
}
async function loop(id){
  const rd=$('reader');
  while(running&&id===runId){
    try{
      const vw=vid.videoWidth,vh=vid.videoHeight;
      if(vw&&rd.clientWidth){
        const b=boxRect(rd);
        box.style.left=b.x+'px';box.style.top=b.y+'px';box.style.width=b.w+'px';box.style.height=b.h+'px';
        const sx=0,sy=0,sw=vw,sh=vh;
        const k=Math.min(1,1000/sw);
        cv.width=Math.max(1,Math.round(sw*k));cv.height=Math.max(1,Math.round(sh*k));
        cx.drawImage(vid,sx,sy,sw,sh,0,0,cv.width,cv.height);
        const r=await ZXingWASM.readBarcodes(cx.getImageData(0,0,cv.width,cv.height),{tryHarder:true,maxNumberOfSymbols:1});
        if(r.length&&/^\d{6,}$/.test(r[0].text||''))onCode(r[0].text);
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,30));
  }
}
async function startCam(){
  const rd=$('reader');
  if(!vid){
    vid=document.createElement('video');vid.setAttribute('playsinline','');vid.muted=true;vid.autoplay=true;rd.appendChild(vid);
    box=document.createElement('div');box.id='box';rd.appendChild(box);
  }
  stopCam();
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  vid.srcObject=stream;await vid.play();
  running=true;loop(++runId);
}
function stopCam(){
  running=false;runId++;
  if(stream){try{stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null}
  if(vid)vid.srcObject=null;
}
async function go(){
  startBtn.hidden=true;
  res.innerHTML='<div class="hint">جاري فتح الكاميرا...</div>';
  try{await loadLib()}catch(e){res.innerHTML='<div class="bad">ما كدرت أحمّل أداة القراءة. تأكد من الإنترنت أول مرة.</div>';startBtn.hidden=false;return}
  try{
    await startCam();
    res.innerHTML='<div class="hint">وجّه الكاميرا نحو الباركود. السعر يطلع هنا.</div>';
  }catch(e){
    res.innerHTML='<div class="bad">ما اشتغلت الكاميرا. اسمح للمتصفح باستخدامها من إعدادات الجهاز ثم اضغط ابدأ المسح.</div>';
    startBtn.hidden=false;
  }
}
startBtn.addEventListener('click',go);
go();
(function(){var el=document.getElementById('upd');if(!el)return;var u=window.UPDATED;if(!u){el.textContent='';return}
el.textContent='آخر تحديث: '+u;var d=new Date(u.replace(' ','T'));if(!isNaN(d)&&(Date.now()-d.getTime())>8*86400000){el.textContent+=' (متأخر)';el.style.color='var(--bad)'}})();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
